- name: Build unsigned IPA
  working-directory: ${{ github.event.inputs.app_dir }}
  run: |
    xcodebuild -workspace ios/Liner.xcworkspace -scheme Liner -configuration Release -archivePath ios/build/Liner.xcarchive archive CODE_SIGNING_ALLOWED=NO

- name: Create Export Options plist
  working-directory: ${{ github.event.inputs.app_dir }}
  run: |
    cat > ios/ExportOptions.plist << 'EOF'
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
      <key>method</key>
      <string>development</string>
      <key>signingStyle</key>
      <string>automatic</string>
      <key>signingCertificate</key>
      <string></string>
      <key>compileBitcode</key>
      <false/>
    </dict>
    </plist>
    EOF

- name: Export IPA
  working-directory: ${{ github.event.inputs.app_dir }}
  run: |
    xcodebuild -exportArchive -archivePath ios/build/Liner.xcarchive -exportPath ios/build -exportOptionsPlist ios/ExportOptions.plist

- name: Upload IPA artifact
  uses: actions/upload-artifact@v4
  with:
    name: ${{ github.event.inputs.ipa_name }}
    path: ios/build/Liner.ipa
